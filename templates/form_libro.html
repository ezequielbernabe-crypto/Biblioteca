{% extends "base.html" %}

{% block content %}

<div class="card">

    <div class="card-header">
        <h2>Nuevo libro</h2>
    </div>

    <div class="card-body">

        <form action="" method="POST">

            <div class="mb-3">
                <label class="form-label">Título</label>

                <input type="text"
                       class="form-control"
                       name="titulo"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Autor</label>

                <input type="text"
                       class="form-control"
                       name="autor"
                       required>
            </div>

            <button class="btn btn-primary" type="submit">
                Guardar
            </button>

        </form>

    </div>

</div>

{% endblock %}
