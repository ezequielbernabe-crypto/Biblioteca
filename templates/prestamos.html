{% extends "base.html" %}

{% block content %}

<h1>Préstamos</h1>

<a href="{{ url_for('nuevo_prestamo') }}"
   class="btn btn-success mb-2">
    Nuevo
</a>

<table class="table table-striped table-hover">

    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Fecha</th>
            <th>Libro</th>
            <th>Lector</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

        {% for item in prestamos %}

        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.fecha }}</td>
            <td>{{ item.libro }}</td>
            <td>{{ item.lector }}</td>
            <td>
                <a href="{{ url_for('eliminar_prestamo', id=item.id) }}"
                class="btn btn-danger"
                onclick="return confirm('¿Está seguro?')">
                Eliminar
            </a>
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
